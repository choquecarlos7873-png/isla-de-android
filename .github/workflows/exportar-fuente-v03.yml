name: Exportar fuente Subtitulos v0.3
on:
  push:
    branches: [build/subtitulos-es-v03]
    paths: [.github/workflows/exportar-fuente-v03.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer codigo fuente
        run: |
          python -m pip install brotli
          python - <<'PY'
          import hashlib, base64, brotli, io, tarfile
          from pathlib import Path
          chunks=[Path(f'source-v03/part{i}.txt').read_text().strip() for i in range(7)]
          expected='12801d9eeecbe3df760dd076e1293b2a'
          code=''.join(chunks)
          if hashlib.md5(code.encode()).hexdigest()!=expected:
            front=''.join(chunks[:4]);lost=chunks[4];back=''.join(chunks[5:])
            alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
            recovered=None
            for i in range(len(lost)+1):
              prefix=(front+lost[:i]).encode();suffix=(lost[i:]+back).encode();hasher=hashlib.md5(prefix)
              for char in alphabet:
                h=hasher.copy();h.update(char.encode());h.update(suffix)
                if h.hexdigest()==expected:
                  recovered=front+lost[:i]+char+lost[i:]+back;break
              if recovered:break
            assert recovered, 'Missing original source';code=recovered
          assert hashlib.md5(code.encode()).hexdigest()==expected
          data=brotli.decompress(base64.b64decode(code))
          with tarfile.open(fileobj=io.BytesIO(data)) as tf:
            tf.extractall('SubtitulosES',filter='data')
          PY
      - name: Empaquetar codigo
        run: tar -czf SubtitulosES-v03-fuente.tar.gz SubtitulosES
      - uses: actions/upload-artifact@v4
        with:
          name: Codigo-Fuente-v03
          path: SubtitulosES-v03-fuente.tar.gz
