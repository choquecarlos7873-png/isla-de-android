name: Compilar Subtitulos ES
on:
  push:
    branches:
      - build/subtitulos-es-apk
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Descomprimir aplicacion independiente
        run: |
          python -m pip install --user brotli
          mkdir -p SubtitulosES
          python - <<'PY'
          import base64, brotli, tarfile, io
          from pathlib import Path
          data=brotli.decompress(base64.b64decode(Path("subtitulos-es-source.br.b64").read_text()))
          with tarfile.open(fileobj=io.BytesIO(data)) as t:
              t.extractall("SubtitulosES",filter="data")
          PY
      - name: Construir APK
        run: gradle --no-daemon -p SubtitulosES assembleDebug
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosES-APK
          path: SubtitulosES/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
